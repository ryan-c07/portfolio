    /* ================= HERO: Three.js liquid form ================= */
    const NOISE_GLSL = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
      uniform float uTime; uniform float uAmp; uniform float uFreq;
      vec3 displace(vec3 p){
        float n = snoise(p * uFreq + vec3(0.0, uTime * 0.25, uTime * 0.15));
        float n2 = snoise(p * uFreq * 2.2 - vec3(uTime * 0.18)) * 0.35;
        return p * (1.0 + (n + n2) * uAmp);
      }`;

    function LiquidCanvas() {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.THREE) return;
        const el = ref.current;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        el.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(34, 1, .1, 60);
        camera.position.set(0, 0.15, 7.2);

        // Translucent "silk" shells: displaced spheres drawn additively with a fresnel edge glow
        const VERT = NOISE_GLSL + `
          uniform float uSeed;
          varying vec3 vN; varying vec3 vV; varying vec3 vP;
          vec3 disp(vec3 p) {
            vec3 q = p + vec3(uSeed);
            float n = snoise(q * uFreq + vec3(0.0, uTime * 0.25, uTime * 0.15));
            float n2 = snoise(q * uFreq * 2.2 - vec3(uTime * 0.18)) * 0.35;
            return p * (1.0 + (n + n2) * uAmp);
          }
          void main() {
            vec3 nrm = normalize(normal);
            vec3 tng = normalize(cross(nrm, abs(nrm.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0)));
            vec3 btg = cross(nrm, tng);
            float eps = 0.015;
            vec3 d0 = disp(position), d1 = disp(position + tng * eps), d2 = disp(position + btg * eps);
            vec3 n2 = normalize(cross(d1 - d0, d2 - d0));
            vec4 mv = modelViewMatrix * vec4(d0, 1.0);
            vN = normalize(normalMatrix * n2);
            vV = normalize(-mv.xyz);
            vP = d0;
            gl_Position = projectionMatrix * mv;
          }`;
        const FRAG = NOISE_GLSL + `
          uniform vec3 uColor; uniform float uRimPow; uniform float uRimStr; uniform float uFill;
          varying vec3 vN; varying vec3 vV; varying vec3 vP;
          void main() {
            float ndv = abs(dot(normalize(vN), normalize(vV)));
            float rim = pow(1.0 - ndv, uRimPow);
            float folds = 0.55 + 0.45 * snoise(vP * 1.6 + vec3(0.0, uTime * 0.12, 0.0));
            float edge = rim * uRimStr;
            float body = uFill * folds * (0.4 + 0.6 * (1.0 - ndv));
            vec3 col = uColor * (edge + body) + vec3(1.0, 0.97, 0.85) * pow(rim, 6.0) * 0.5;
            gl_FragColor = vec4(col, clamp(edge + body, 0.0, 1.0));
          }`;
        const geo = new THREE.IcosahedronGeometry(1.8, 96);
        const shells = [];
        const mk = (scale, seed, rimPow, rimStr, fill, amp) => {
          const u = { uTime: { value: 0 }, uAmp: { value: amp }, uFreq: { value: .7 }, uSeed: { value: seed },
            uColor: { value: new THREE.Color(0xe5be3e) }, uRimPow: { value: rimPow }, uRimStr: { value: rimStr }, uFill: { value: fill } };
          const m = new THREE.ShaderMaterial({ uniforms: u, vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
          const mesh = new THREE.Mesh(geo, m); mesh.scale.setScalar(scale); scene.add(mesh); shells.push({ mesh, u }); return mesh;
        };
        const group = new THREE.Group(); scene.add(group);
        [mk(1.00, 0.0, 2.6, 1.15, .045, .11), mk(0.93, 3.7, 3.2, .75, .035, .13), mk(0.85, 8.1, 3.8, .55, .03, .15)].forEach(m => group.add(m));

        // Stars
        const sGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array(360 * 3);
        for (let i = 0; i < 360; i++) { sPos[i * 3] = (Math.random() - .5) * 26; sPos[i * 3 + 1] = (Math.random() - .3) * 14; sPos[i * 3 + 2] = -6 - Math.random() * 10; }
        sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: .045, transparent: true, opacity: .7, sizeAttenuation: true }));
        scene.add(stars);

        // Layout
        let w = 1, h = 1;
        const resize = () => {
          w = el.clientWidth; h = el.clientHeight;
          renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
          const visH = 2 * camera.position.z * Math.tan(camera.fov * Math.PI / 360);
          group.position.y = -visH * .5 + 0.05;
          const s = Math.min(1.25, Math.max(.8, w / 1200));
          group.scale.set(1.35 * s, s, s);
        };
        const ro = new ResizeObserver(resize); ro.observe(el); resize();

        // Pointer parallax
        const target = { x: 0, y: 0 }; const cur = { x: 0, y: 0 };
        const onMove = e => { const r = el.getBoundingClientRect(); target.x = ((e.clientX - r.left) / r.width - .5); target.y = ((e.clientY - r.top) / r.height - .5); };
        el.parentElement.addEventListener('pointermove', onMove);

        let raf = 0, visible = true, t0 = performance.now();
        const frame = now => {
          const t = (now - t0) / 1000;
          shells.forEach(({ u }) => u.uTime.value = t);
          cur.x += (target.x - cur.x) * .04; cur.y += (target.y - cur.y) * .04;
          group.rotation.y = t * .05 + cur.x * .35;
          group.rotation.x = cur.y * .2;
          stars.rotation.z = t * .004;
          renderer.render(scene, camera);
          raf = (!reduced && visible) ? requestAnimationFrame(frame) : 0;
        };
        raf = requestAnimationFrame(frame);
        // Stop drawing while the hero is scrolled out of view; resume when it returns.
        const vis = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !raf && !reduced) raf = requestAnimationFrame(frame); });
        vis.observe(el);

        return () => {
          cancelAnimationFrame(raf); ro.disconnect(); vis.disconnect(); el.parentElement.removeEventListener('pointermove', onMove);
          geo.dispose(); shells.forEach(s => s.mesh.material.dispose()); sGeo.dispose(); renderer.dispose(); el.removeChild(renderer.domElement);
        };
      }, []);
      return <div ref={ref} className="hero-canvas" />;
    }

    /* ================= GITHUB ACTIVITY ================= */
    const timeAgo = iso => {
      const sec = (Date.now() - new Date(iso)) / 1000;
      for (const [n, u] of [[31536000, 'y'], [2592000, 'mo'], [604800, 'w'], [86400, 'd'], [3600, 'h'], [60, 'm']]) if (sec >= n) return `${Math.floor(sec / n)}${u} ago`;
      return 'just now';
    };

    // Public GitHub activity. Push events no longer carry commit messages, so each latest push's head commit is looked up.
    // Results are cached for 10 minutes per tab to stay well under the unauthenticated rate limit (60 requests/hour).
    function useGitHubActivity(user) {
      const [state, setState] = useState({ status: 'loading' });
      useEffect(() => {
        let alive = true;
        const key = `gh-activity:${user}`;
        try {
          const cached = JSON.parse(sessionStorage.getItem(key) || 'null');
          if (cached && Date.now() - cached.t < 600000) { setState({ status: 'ready', ...cached.d }); return; }
        } catch {}
        (async () => {
          try {
            const res = await fetch(`https://api.github.com/users/${user}/events/public?per_page=100`, { headers: { Accept: 'application/vnd.github+json' } });
            if (!res.ok) throw new Error(`GitHub ${res.status}`);
            const events = (await res.json()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const pushes = events.filter(e => e.type === 'PushEvent' && e.payload && e.payload.head);
            const weekAgo = Date.now() - 7 * 864e5;
            const thisWeek = pushes.filter(e => new Date(e.created_at) > weekAgo);
            const latest = [];
            for (const e of pushes) {
              if (latest.length === 3) break;
              if (!latest.some(x => x.sha === e.payload.head)) latest.push({ repo: e.repo.name, sha: e.payload.head, at: e.created_at });
            }
            const items = await Promise.all(latest.map(async it => {
              try {
                const c = await (await fetch(`https://api.github.com/repos/${it.repo}/commits/${it.sha}`)).json();
                return { ...it, msg: (c.commit && c.commit.message || '').split('\n')[0], url: c.html_url || `https://github.com/${it.repo}` };
              } catch { return { ...it, msg: '', url: `https://github.com/${it.repo}` }; }
            }));
            const d = { items, weekPushes: thisWeek.length, weekRepos: new Set(thisWeek.map(e => e.repo.name)).size, lastAt: events[0] && events[0].created_at };
            try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch {}
            if (alive) setState({ status: 'ready', ...d });
          } catch { if (alive) setState({ status: 'error' }); }
        })();
        return () => { alive = false; };
      }, [user]);
      return state;
    }

                <ExperienceTimeline />
              </Grid>
              <Grid item xs={12} md={5}>
                <Typography component="h3" sx={{ fontWeight: 600, mb: 2, fontSize: 16 }}>Education</Typography>
                <Reveal delay={.1}>
                  <Card sx={{ p: 3, bgcolor: '#fff', transition: 'border-color 200ms ease', '&:hover': { borderColor: '#E5BE3E' } }}>
                    <Stack direction="row" justifyContent="space-between" alignItems="flex-start" spacing={2}>
                      <Box><span className="label label-y">{EDUCATION.school}</span><Typography sx={{ fontWeight: 650, mt: .5 }}>{EDUCATION.degree}</Typography></Box>
                      <Chip size="small" label={EDUCATION.when} className="mono" sx={{ bgcolor: '#1c1917', color: '#fff', flexShrink: 0, fontSize: 12 }} />
                    </Stack>
                    <Stack spacing={.75} sx={{ mt: 2 }}>
                      {EDUCATION.bullets.map(b => <Stack key={b} direction="row" spacing={1.25}><Box sx={{ mt: 1, width: 5, height: 5, borderRadius: 99, bgcolor: '#E5BE3E', flexShrink: 0 }} /><Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.7 }}>{b}</Typography></Stack>)}
                    </Stack>
                  </Card>
                </Reveal>
              </Grid>
            </Grid>
          </Container>
        </Box>
      );
    }

    /* ================= CONTACT ================= */
    function Contact({ notify }) {
      const [v, setV] = useState({ name: '', email: '', subject: '', message: '' });
      const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
      const rules = {
        name: x => x.trim().length >= 2 || 'Please enter your name (at least 2 characters).',
        email: x => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x.trim()) || 'Email must include an @ and a domain.',
        subject: x => x.trim().length >= 2 || 'Please add a short subject.',
        message: x => x.trim().length >= 10 || 'Message should be at least 10 characters.',
      };
      const check = k => { const r = rules[k](v[k]); setErr(e => ({ ...e, [k]: r === true ? '' : r })); return r === true; };
      const submit = e => {
        e.preventDefault();
        const ok = Object.keys(rules).map(check).every(Boolean);
        if (!ok) { notify('Fix the highlighted fields and try again.', 'error'); return; }
        setBusy(true);
        setTimeout(() => {
          const body = `${v.message}\n\n- ${v.name} (${v.email})`;
          window.location.href = `mailto:${PROFILE.email}?subject=${encodeURIComponent(v.subject)}&body=${encodeURIComponent(body)}`;
          notify(`Thanks ${v.name.split(' ')[0]}. Your mail client should open now.`, 'success');
          setV({ name: '', email: '', subject: '', message: '' }); setErr({}); setBusy(false);
        }, 700);
      };
      // Label above the input (never placeholder-as-label); the error text sits below and is tied to the field.
      const f = (k, label, extra = {}) => (
        <Box>
          <Box component="label" htmlFor={`field-${k}`} sx={{ display: 'block', fontSize: 14, fontWeight: 500, mb: .75 }}>{label}</Box>
          <TextField id={`field-${k}`} name={k} value={v[k]} onChange={e => setV({ ...v, [k]: e.target.value })} onBlur={() => check(k)}
            error={!!err[k]} helperText={err[k] || ' '} {...extra} />
        </Box>
      );
      return (
        <Box component="section" id="contact" sx={{ pt: { xs: 10, md: 14 }, pb: { xs: 11, md: 15 }, borderTop: '1px solid', borderColor: 'divider' }}>
          <Container maxWidth="lg">
            <Grid container spacing={6}>
              <Grid item xs={12} md={5}>
                <Reveal>
                  <Typography variant="h2">Let's talk.</Typography>
                  <Typography color="text.secondary" sx={{ mt: 2.5, lineHeight: 1.75, maxWidth: '44ch' }}>Internship, freelance database work, or a hackathon team. My inbox is open.</Typography>
                  <Stack sx={{ mt: 4 }} spacing={0}>
                    {[[PROFILE.email, `mailto:${PROFILE.email}`], [PROFILE.phone, `tel:${PROFILE.phone.replace(/-/g, '')}`], ['ryanchen.xyz', PROFILE.site], ['linkedin.com/in/ryanchen07', PROFILE.linkedin], ['github.com/ryan-c07', PROFILE.github]].map(([t, h]) => (
                      <Box component="a" key={t} href={h} target={h.startsWith('http') ? '_blank' : undefined} rel="noopener"
                        sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', py: 1.75, borderBottom: '1px solid', borderColor: 'divider', color: 'text.primary', textDecoration: 'none', fontWeight: 500,
                          '& .arrow': { color: 'var(--yellow-ink)', transition: 'transform 220ms cubic-bezier(0.23, 1, 0.32, 1)' },
                          '@media (hover: hover) and (pointer: fine)': { '&:hover .arrow': { transform: 'translate(2px, -2px)' } } }}>
                        <span>{t}</span><span className="arrow">{I.out}</span>
                      </Box>
                    ))}
                  </Stack>
                </Reveal>
              </Grid>
              <Grid item xs={12} md={7}>
                <Reveal delay={.1}>
                  <Card component="form" noValidate onSubmit={submit} aria-label="Contact form" sx={{ p: { xs: 3, md: 4 }, bgcolor: '#fff' }}>
                    <Grid container spacing={2}>
                      <Grid item xs={12} sm={6}>{f('name', 'Name')}</Grid>
                      <Grid item xs={12} sm={6}>{f('email', 'Email', { type: 'email' })}</Grid>
                      <Grid item xs={12}>{f('subject', 'Subject')}</Grid>
                      <Grid item xs={12}>{f('message', 'Message', { multiline: true, minRows: 4 })}</Grid>
                    </Grid>
                    <Button type="submit" variant="contained" size="large" fullWidth disabled={busy} sx={{ mt: 1 }}>{busy ? 'Sending…' : 'Send message'}</Button>
                    <Typography variant="caption" color="text.secondary" sx={{ display: 'block', textAlign: 'center', mt: 1.5 }}>Opens your mail client with the message pre-filled.</Typography>
                  </Card>
                </Reveal>
              </Grid>
            </Grid>
          </Container>
        </Box>
      );
    }

    /* ================= APP ================= */
    function App() {
      const [proj, setProj] = useState(null);
      const [snack, setSnack] = useState(null);
      const notify = (msg, type = 'success') => setSnack({ msg, type });
      const toContact = () => document.getElementById('contact').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return (
        <ThemeProvider theme={theme}>
          <MotionConfig reducedMotion="user">
          <CssBaseline />
          <a href="#main" className="skip-link">Skip to content</a>
          <FloatingNav onContact={toContact} />
          <Hero onContact={toContact} />
          <Box component="main" id="main" tabIndex={-1}>
            <About />
            <Now />
            <Projects onOpen={setProj} />
            <StackSection />
            <Resume />
            <Contact notify={notify} />
          </Box>
          <Box component="footer" sx={{ borderTop: '1px solid', borderColor: 'divider', py: 4 }}>
            <Container maxWidth="lg">
              <Stack direction={{ xs: 'column', sm: 'row' }} justifyContent="space-between" alignItems={{ sm: 'center' }} spacing={1.5} sx={{ fontSize: 14, color: 'text.secondary' }}>
                <span>© {new Date().getFullYear()} {PROFILE.name}. Built with React and Material UI.</span>
                <Stack direction="row" spacing={2.5} sx={{ '& a': { color: 'inherit', textDecoration: 'none', transition: 'color 200ms ease' }, '& a:hover': { color: 'text.primary' } }}>
                  <a href={PROFILE.github} target="_blank" rel="noopener">GitHub</a>
                  <a href={PROFILE.linkedin} target="_blank" rel="noopener">LinkedIn</a>
                  <a href={`mailto:${PROFILE.email}`}>Email</a>
                  <a href={PROFILE.resume} target="_blank" rel="noopener">Resume</a>
                </Stack>
              </Stack>
            </Container>
          </Box>
          <ProjectDialog p={proj} onClose={() => setProj(null)} onContact={toContact} />
          <Snackbar open={!!snack} autoHideDuration={4500} onClose={() => setSnack(null)} anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}>
            {snack && <Alert onClose={() => setSnack(null)} severity={snack.type} variant="filled" sx={{ borderRadius: 3, bgcolor: snack.type === 'success' ? '#E5BE3E' : undefined, color: snack.type === 'success' ? '#000' : undefined, fontWeight: 600 }}>{snack.msg}</Alert>}
          </Snackbar>
          </MotionConfig>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
