    function useTypewriter(words, speed = 55, pause = 1600) {
      const [i, setI] = useState(0), [txt, setTxt] = useState(''), [del, setDel] = useState(false);
      useEffect(() => {
        const w = words[i % words.length];
        let t;
        if (!del && txt === w) t = setTimeout(() => setDel(true), pause);
        else if (del && txt === '') { setDel(false); setI(i + 1); }
        else t = setTimeout(() => setTxt(del ? w.slice(0, txt.length - 1) : w.slice(0, txt.length + 1)), del ? speed / 2 : speed);
        return () => clearTimeout(t);
      }, [txt, del, i]);
      return txt;
    }

    /* ================= HERO: Three.js liquid form ================= */
    const NOISE_GLSL = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
      uniform float uTime; uniform float uAmp; uniform float uFreq;
      vec3 displace(vec3 p){
        float n = snoise(p * uFreq + vec3(0.0, uTime * 0.25, uTime * 0.15));
        float n2 = snoise(p * uFreq * 2.2 - vec3(uTime * 0.18)) * 0.35;
        return p * (1.0 + (n + n2) * uAmp);
      }`;

    function LiquidCanvas() {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.THREE) return;
        const el = ref.current;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        el.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(34, 1, .1, 60);
        camera.position.set(0, 0.15, 7.2);

        // Translucent "silk" shells: displaced spheres drawn additively with a fresnel edge glow
        const VERT = NOISE_GLSL + `
          uniform float uSeed;
          varying vec3 vN; varying vec3 vV; varying vec3 vP;
          vec3 disp(vec3 p) {
            vec3 q = p + vec3(uSeed);
            float n = snoise(q * uFreq + vec3(0.0, uTime * 0.25, uTime * 0.15));
            float n2 = snoise(q * uFreq * 2.2 - vec3(uTime * 0.18)) * 0.35;
            return p * (1.0 + (n + n2) * uAmp);
          }
          void main() {
            vec3 nrm = normalize(normal);
            vec3 tng = normalize(cross(nrm, abs(nrm.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0)));
            vec3 btg = cross(nrm, tng);
            float eps = 0.015;
            vec3 d0 = disp(position), d1 = disp(position + tng * eps), d2 = disp(position + btg * eps);
            vec3 n2 = normalize(cross(d1 - d0, d2 - d0));
            vec4 mv = modelViewMatrix * vec4(d0, 1.0);
            vN = normalize(normalMatrix * n2);
            vV = normalize(-mv.xyz);
            vP = d0;
            gl_Position = projectionMatrix * mv;
          }`;
        const FRAG = NOISE_GLSL + `
          uniform vec3 uColor; uniform float uRimPow; uniform float uRimStr; uniform float uFill;
          varying vec3 vN; varying vec3 vV; varying vec3 vP;
          void main() {
            float ndv = abs(dot(normalize(vN), normalize(vV)));
            float rim = pow(1.0 - ndv, uRimPow);
            float folds = 0.55 + 0.45 * snoise(vP * 1.6 + vec3(0.0, uTime * 0.12, 0.0));
            float edge = rim * uRimStr;
            float body = uFill * folds * (0.4 + 0.6 * (1.0 - ndv));
            vec3 col = uColor * (edge + body) + vec3(1.0, 0.97, 0.85) * pow(rim, 6.0) * 0.5;
            gl_FragColor = vec4(col, clamp(edge + body, 0.0, 1.0));
          }`;
        const geo = new THREE.IcosahedronGeometry(1.8, 96);
        const shells = [];
        const mk = (scale, seed, rimPow, rimStr, fill, amp) => {
          const u = { uTime: { value: 0 }, uAmp: { value: amp }, uFreq: { value: .7 }, uSeed: { value: seed },
            uColor: { value: new THREE.Color(0xffd400) }, uRimPow: { value: rimPow }, uRimStr: { value: rimStr }, uFill: { value: fill } };
          const m = new THREE.ShaderMaterial({ uniforms: u, vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
          const mesh = new THREE.Mesh(geo, m); mesh.scale.setScalar(scale); scene.add(mesh); shells.push({ mesh, u }); return mesh;
        };
        const group = new THREE.Group(); scene.add(group);
        [mk(1.00, 0.0, 2.6, 1.15, .045, .11), mk(0.93, 3.7, 3.2, .75, .035, .13), mk(0.85, 8.1, 3.8, .55, .03, .15)].forEach(m => group.add(m));

        // Stars
        const sGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array(360 * 3);
        for (let i = 0; i < 360; i++) { sPos[i * 3] = (Math.random() - .5) * 26; sPos[i * 3 + 1] = (Math.random() - .3) * 14; sPos[i * 3 + 2] = -6 - Math.random() * 10; }
        sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: .045, transparent: true, opacity: .7, sizeAttenuation: true }));
        scene.add(stars);

        // Layout
        let w = 1, h = 1;
        const resize = () => {
          w = el.clientWidth; h = el.clientHeight;
          renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
          const visH = 2 * camera.position.z * Math.tan(camera.fov * Math.PI / 360);
          group.position.y = -visH * .5 + 0.05;
          const s = Math.min(1.25, Math.max(.8, w / 1200));
          group.scale.set(1.35 * s, s, s);
        };
        const ro = new ResizeObserver(resize); ro.observe(el); resize();

        // Pointer parallax
        const target = { x: 0, y: 0 }; const cur = { x: 0, y: 0 };
        const onMove = e => { const r = el.getBoundingClientRect(); target.x = ((e.clientX - r.left) / r.width - .5); target.y = ((e.clientY - r.top) / r.height - .5); };
        el.parentElement.addEventListener('pointermove', onMove);

        let raf, t0 = performance.now();
        const frame = now => {
          const t = (now - t0) / 1000;
          shells.forEach(({ u }) => u.uTime.value = t);
          cur.x += (target.x - cur.x) * .04; cur.y += (target.y - cur.y) * .04;
          group.rotation.y = t * .05 + cur.x * .35;
          group.rotation.x = cur.y * .2;
          stars.rotation.z = t * .004;
          renderer.render(scene, camera);
          if (!reduced) raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);

        return () => {
          cancelAnimationFrame(raf); ro.disconnect(); el.parentElement.removeEventListener('pointermove', onMove);
          geo.dispose(); shells.forEach(s => s.mesh.material.dispose()); sGeo.dispose(); renderer.dispose(); el.removeChild(renderer.domElement);
        };
      }, []);
      return <div ref={ref} className="hero-canvas" />;
    }

                        {n.title && <Typography sx={{ mt: 2, fontWeight: 800, fontSize: dark ? 26 : 19, letterSpacing: '-0.02em', color: dark ? '#fff' : 'inherit', lineHeight: 1.2 }}>{n.title}</Typography>}
                        <Typography sx={{ mt: n.title ? 1.25 : 1.5, lineHeight: 1.7, color: dark ? 'rgba(255,255,255,.7)' : 'text.secondary', maxWidth: 560 }}>{n.body}</Typography>
                        {n.label === 'Now listening to' && <Stack direction="row" spacing={.5} sx={{ mt: 'auto', pt: 2, alignItems: 'flex-end', height: 34 }}>
                          {[0, 1, 2, 3, 4].map(k => <motion.span key={k} animate={{ height: [4, 14, 6, 16, 4] }} transition={{ repeat: Infinity, duration: 1.4 + k * .2 }} style={{ width: 4, background: '#ffd400', borderRadius: 2 }} />)}
                        </Stack>}
                      </SpotlightCard>
                    </Reveal>
                  </Box>
                );
              })}
            </Box>
          </Container>
        </Box>
      );
    }

    /* ================= PROJECTS ================= */
    function Projects({ onOpen }) {
      const md = useMediaQuery('(min-width:900px)'), sm = useMediaQuery('(min-width:600px)');
      const visible = md ? 3 : sm ? 2 : 1;
      const [i, setI] = useState(0);
      const max = Math.max(0, PROJECTS.length - visible);
      const go = d => setI(x => Math.min(max, Math.max(0, x + d)));
      useEffect(() => { setI(x => Math.min(x, max)); }, [max]);
      return (
        <Box component="section" id="projects" sx={{ py: { xs: 9, md: 12 } }}>
          <Container maxWidth="lg">
            <SectionHead label="Projects" title="Selected builds across databases, AI, and full-stack engineering." />
            <Box sx={{ overflow: 'hidden', mx: -1 }}>
              <motion.div animate={{ x: `${-i * (100 / visible)}%` }} transition={{ type: 'spring', stiffness: 260, damping: 30 }} style={{ display: 'flex' }}>
                {PROJECTS.map((p, k) => (
                  <Box key={p.id} sx={{ flex: `0 0 ${100 / visible}%`, px: 1 }}>
                    <Reveal delay={k * .08} style={{ height: '100%' }}>
                      <motion.div whileHover={{ y: -6 }} style={{ height: '100%' }}>
                        <SpotlightCard className="proj" onClick={() => onOpen(p)} sx={{ cursor: 'pointer' }} innerSx={{ display: 'flex', flexDirection: 'column' }}>
                          <div className="preview"><p.Preview /></div>
                          <CardContent sx={{ p: 3, flex: 1, display: 'flex', flexDirection: 'column' }}>
                            <Stack direction="row" justifyContent="space-between" alignItems="center">
                              <span className="label label-y">{p.tag}</span>
                              <Chip size="small" label={p.badge} sx={{ bgcolor: p.badge === 'Headstarter' ? '#f0f0ec' : '#ffd400', color: '#000', height: 22, fontSize: 11 }} />
                            </Stack>
                            <Typography sx={{ fontWeight: 800, fontSize: 19, mt: 1.5, letterSpacing: '-0.02em' }}>{p.title}</Typography>
                            <Typography variant="body2" color="text.secondary" sx={{ mt: 1, lineHeight: 1.7 }}>{p.desc}</Typography>
                            <Stack direction="row" flexWrap="wrap" gap={.75} sx={{ mt: 2 }}>
                              {p.stack.map(s => <Chip key={s} size="small" label={s} variant="outlined" sx={{ height: 24, fontSize: 11 }} />)}
                            </Stack>
                            <Stack direction="row" spacing={1} sx={{ mt: 'auto', pt: 2.5 }} onClick={e => e.stopPropagation()}>
                              <Button variant="contained" size="small" onClick={() => onOpen(p)}>View details</Button>
                              {p.code ? <Button variant="outlined" color="secondary" size="small" href={p.code} target="_blank" rel="noopener" endIcon={I.out}>View code</Button>
                                : <Button variant="outlined" color="secondary" size="small" disabled>Code private</Button>}
                            </Stack>
                          </CardContent>
                        </SpotlightCard>
                      </motion.div>
                    </Reveal>
                  </Box>
                ))}
              </motion.div>
            </Box>
            <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mt: 3 }}>
              <IconButton onClick={() => go(-1)} disabled={i === 0} sx={{ border: '1px solid', borderColor: 'divider' }}>{I.left}</IconButton>
              <Stack direction="row" spacing={.75}>
                {Array.from({ length: max + 1 }).map((_, k) => (
                  <motion.button key={k} onClick={() => setI(k)} animate={{ width: k === i ? 22 : 8, background: k === i ? '#ffd400' : '#e6e6e2' }}
                    style={{ height: 8, borderRadius: 999, border: 0, padding: 0, cursor: 'pointer' }} aria-label={`Slide ${k + 1}`} />
                ))}
              </Stack>
              <IconButton onClick={() => go(1)} disabled={i === max} sx={{ border: '1px solid', borderColor: 'divider' }}>{I.right}</IconButton>
            </Stack>
          </Container>
        </Box>
      );
    }

    function ProjectDialog({ p, onClose, onContact }) {
      return (
        <Dialog open={!!p} onClose={onClose} maxWidth="md" fullWidth PaperProps={{ sx: { borderRadius: 4 } }}>
          {p && (
            <DialogContent sx={{ p: { xs: 3, md: 5 } }}>
              <IconButton onClick={onClose} sx={{ position: 'absolute', top: 14, right: 14 }} aria-label="Close">{I.x}</IconButton>
              <Stack direction="row" spacing={1} alignItems="center" flexWrap="wrap">
                <Chip size="small" label={p.badge} sx={{ bgcolor: '#ffd400', color: '#000' }} />
                <Chip size="small" label={p.tag} variant="outlined" />
                <span className="label">{p.date}</span>
              </Stack>
              <Typography variant="h2" sx={{ mt: 2, pr: 5 }}>{p.title}</Typography>
              <Typography color="text.secondary" sx={{ mt: 1 }}>{p.desc}</Typography>
              <Box sx={{ mt: 3, borderRadius: 3, overflow: 'hidden', border: '1px solid', borderColor: 'divider' }}><div className="preview" style={{ borderBottom: 0 }}><p.Preview /></div></Box>
              <div className="label label-y" style={{ marginTop: 32, marginBottom: 12 }}>Impact</div>
              <Stack spacing={1.25}>{p.highlights.map(h => <Stack key={h} direction="row" spacing={1.5}><Box sx={{ mt: 1.1, width: 6, height: 6, borderRadius: 99, bgcolor: '#ffd400', flexShrink: 0 }} /><Typography>{h}</Typography></Stack>)}</Stack>
              <div className="label label-y" style={{ marginTop: 32, marginBottom: 12 }}>Architecture</div>
              <Grid container spacing={1.5}>
                {p.arch.map(([t, b], k) => (
                  <Grid item xs={12} sm={6} key={t}>
                    <Card sx={{ p: 2.5, height: '100%', bgcolor: '#f6f6f4', '&:hover': { borderColor: '#ffd400' } }}>
                      <span className="label">0{k + 1}</span>
                      <Typography sx={{ fontWeight: 700, mt: .5 }}>{t}</Typography>
                      <Typography variant="body2" color="text.secondary" sx={{ mt: .75, lineHeight: 1.7 }}>{b}</Typography>
                    </Card>
                  </Grid>
                ))}
              </Grid>
              <Stack direction="row" spacing={1} sx={{ mt: 4 }} flexWrap="wrap">
                {p.code && <Button variant="contained" href={p.code} target="_blank" rel="noopener" endIcon={I.out}>View code</Button>}
                <Button variant="outlined" color="secondary" onClick={() => { onClose(); onContact(); }}>Ask me about this</Button>
              </Stack>
            </DialogContent>
          )}
        </Dialog>
      );
    }

    /* ================= STACK ================= */
    function StackSection() {
      const [q, setQ] = useState('');
      return (
        <Box component="section" id="stack" sx={{ py: { xs: 9, md: 12 }, bgcolor: '#f6f6f4', borderTop: '1px solid', borderBottom: '1px solid', borderColor: 'divider' }}>
          <Container maxWidth="lg">
            <SectionHead label="Stack" title="Tools I use to build across interfaces, data, systems, and AI-assisted workflows."
              right={<TextField size="small" placeholder="Filter skills…" value={q} onChange={e => setQ(e.target.value)} sx={{ width: { xs: '100%', md: 240 }, '& .MuiOutlinedInput-root': { borderRadius: 999, bgcolor: '#fff' } }} />} />
            <Reveal>
              <Box className="marquee" sx={{ mb: 6, py: 1.5, borderTop: '1px solid', borderBottom: '1px solid', borderColor: 'divider' }}>
                <div className="marquee-track">
                  {[0, 1].map(copy => MARQUEE_ITEMS.map(s => (
                    <Stack key={copy + s.n} direction="row" alignItems="center" spacing={1.25} aria-hidden={copy === 1}
                      sx={{ px: 3.5, flexShrink: 0, opacity: .7, transition: 'opacity .2s', '&:hover': { opacity: 1 } }}>
                      <TechIcon item={s} size={22} />
                      <Typography sx={{ fontWeight: 700, fontSize: 15, whiteSpace: 'nowrap' }}>{s.n}</Typography>
                    </Stack>
                  )))}
                </div>
              </Box>
            </Reveal>
            <Stack spacing={4}>
              {Object.entries(STACK).map(([group, items], gi) => {
                const list = items.filter(s => s.n.toLowerCase().includes(q.toLowerCase()));
                if (!list.length) return null;
                return (
                  <Reveal key={group} delay={gi * .06}>
                    <Typography sx={{ fontWeight: 800, mb: 1.5 }}>{group}</Typography>
                    <Stack direction="row" flexWrap="wrap" gap={1}>
                      {list.map(s => (
                        <motion.div key={s.n} whileHover={{ y: -3, scale: 1.03 }} whileTap={{ scale: .97 }}>
                          <Chip label={s.n} icon={<Box sx={{ ml: '6px !important', width: 22, height: 22, borderRadius: 99, bgcolor: '#f0f0ec', display: 'grid', placeItems: 'center' }}><TechIcon item={s} /></Box>}
                            sx={{ bgcolor: '#fff', border: '1px solid', borderColor: 'divider', pl: 0, pr: .5, height: 36, '&:hover': { borderColor: '#ffd400', bgcolor: '#fffbe0' } }} />
                        </motion.div>
                      ))}
                    </Stack>
                  </Reveal>
                );
              })}
            </Stack>
          </Container>
        </Box>
      );
    }

    /* ================= RESUME ================= */
    // Vertical timeline whose yellow line fills as you scroll; each dot lights up as its role reaches the middle of the screen.
    function ExperienceTimeline() {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start 70%', 'end 55%'] });
      const fill = useSpring(scrollYProgress, { stiffness: 140, damping: 30, restDelta: .001 });
      return (
        <Box ref={ref} sx={{ position: 'relative', pl: 5 }}>
          <Box sx={{ position: 'absolute', left: 11, top: 10, bottom: 10, width: 2, bgcolor: 'divider', borderRadius: 2 }} />
          <motion.div aria-hidden style={{ position: 'absolute', left: 11, top: 10, bottom: 10, width: 2, background: '#ffd400', borderRadius: 2, transformOrigin: 'top', scaleY: fill }} />
          <Stack spacing={2.5}>{EXPERIENCE.map(x => <TimelineItem key={x.role + x.when} x={x} />)}</Stack>
        </Box>
      );
    }

    function TimelineItem({ x }) {
      const ref = useRef(null);
      const lit = useInView(ref, { margin: '0px 0px -45% 0px' });
      return (
        <Box ref={ref} sx={{ position: 'relative' }}>
          <motion.span aria-hidden animate={{ backgroundColor: lit ? '#ffd400' : '#ffffff', borderColor: lit ? '#0a0a0a' : '#d6d6d2', scale: lit ? 1 : .8 }}
            transition={{ duration: .35 }} style={{ position: 'absolute', left: -36, top: 22, width: 16, height: 16, borderRadius: 99, border: '2px solid', boxShadow: lit ? '0 0 0 5px rgba(255,212,0,.22)' : 'none' }} />
          <Reveal>
            <SpotlightCard bg="#fafaf8" innerSx={{ p: 3 }}>
              <Stack direction="row" justifyContent="space-between" alignItems="flex-start" spacing={2}>
                <Box><span className="label label-y">{x.org}</span><Typography sx={{ fontWeight: 800, mt: .5 }}>{x.role}</Typography></Box>
                <Chip size="small" label={x.when} sx={{ bgcolor: '#0a0a0a', color: '#ffd400', flexShrink: 0 }} />
              </Stack>
              <Stack spacing={.75} sx={{ mt: 1.5 }}>
                {x.bullets.map(b => <Stack key={b} direction="row" spacing={1.25}><Box sx={{ mt: 1, width: 5, height: 5, borderRadius: 99, bgcolor: '#ffd400', flexShrink: 0 }} /><Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.7 }}>{b}</Typography></Stack>)}
              </Stack>
            </SpotlightCard>
          </Reveal>
        </Box>
      );
    }

    function Resume() {
      return (
        <Box component="section" id="resume" sx={{ py: { xs: 9, md: 12 } }}>
          <Container maxWidth="lg">
            <SectionHead label="Resume" title="Experience, education, and the teams that shaped how I build."
              right={<Button variant="contained" href={PROFILE.resume} target="_blank" rel="noopener" endIcon={I.out}>View resume (PDF)</Button>} />
            <Grid container spacing={4}>
              <Grid item xs={12} md={7}>
                <Typography sx={{ fontWeight: 800, mb: 2 }}>Experience</Typography>
                <ExperienceTimeline />
              </Grid>
              <Grid item xs={12} md={5}>
                <Typography sx={{ fontWeight: 800, mb: 2 }}>Education</Typography>
                <Reveal delay={.1}>
                  <Card sx={{ p: 3, bgcolor: '#f6f6f4', '&:hover': { borderColor: '#ffd400' } }}>
                    <Stack direction="row" justifyContent="space-between" alignItems="flex-start" spacing={2}>
                      <Box><span className="label label-y">{EDUCATION.school}</span><Typography sx={{ fontWeight: 800, mt: .5 }}>{EDUCATION.degree}</Typography></Box>
                      <Chip size="small" label={EDUCATION.when} sx={{ bgcolor: '#0a0a0a', color: '#ffd400', flexShrink: 0 }} />
                    </Stack>
                    <Box sx={{ mt: 2 }}>
                      <Stack direction="row" justifyContent="space-between"><Typography variant="body2" sx={{ fontWeight: 700 }}>GPA 3.67 / 4.00</Typography><Typography variant="body2" color="text.secondary">92%</Typography></Stack>
                      <LinearProgress variant="determinate" value={92} sx={{ mt: .75, height: 6, borderRadius: 99, bgcolor: '#e6e6e2', '& .MuiLinearProgress-bar': { bgcolor: '#ffd400' } }} />
                    </Box>
                    <Stack spacing={.75} sx={{ mt: 2 }}>
                      {EDUCATION.bullets.map(b => <Stack key={b} direction="row" spacing={1.25}><Box sx={{ mt: 1, width: 5, height: 5, borderRadius: 99, bgcolor: '#ffd400', flexShrink: 0 }} /><Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.7 }}>{b}</Typography></Stack>)}
                    </Stack>
                  </Card>
                </Reveal>
              </Grid>
            </Grid>
          </Container>
        </Box>
      );
    }

    /* ================= CONTACT ================= */
    function Contact({ notify }) {
      const [v, setV] = useState({ name: '', email: '', subject: '', message: '' });
      const [err, setErr] = useState({}); const [busy, setBusy] = useState(false);
      const rules = {
        name: x => x.trim().length >= 2 || 'Please enter your name (at least 2 characters).',
        email: x => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x.trim()) || 'Email must include an @ and a domain.',
        subject: x => x.trim().length >= 2 || 'Please add a short subject.',
        message: x => x.trim().length >= 10 || 'Message should be at least 10 characters.',
      };
      const check = k => { const r = rules[k](v[k]); setErr(e => ({ ...e, [k]: r === true ? '' : r })); return r === true; };
      const submit = e => {
        e.preventDefault();
        const ok = Object.keys(rules).map(check).every(Boolean);
        if (!ok) { notify('Fix the highlighted fields and try again.', 'error'); return; }
        setBusy(true);
        setTimeout(() => {
          const body = `${v.message}\n\n— ${v.name} (${v.email})`;
          window.location.href = `mailto:${PROFILE.email}?subject=${encodeURIComponent(v.subject)}&body=${encodeURIComponent(body)}`;
          notify(`Thanks ${v.name.split(' ')[0]}. Your mail client should open now.`, 'success');
          setV({ name: '', email: '', subject: '', message: '' }); setErr({}); setBusy(false);
        }, 700);
      };
      const f = (k, label, extra = {}) => (
        <TextField label={label} value={v[k]} onChange={e => setV({ ...v, [k]: e.target.value })} onBlur={() => check(k)}
          error={!!err[k]} helperText={err[k] || ' '} {...extra} />
      );
      return (
        <Box component="section" id="contact" sx={{ py: { xs: 9, md: 12 }, bgcolor: '#0a0a0a', color: '#fff' }}>
          <Container maxWidth="lg">
            <Grid container spacing={6}>
              <Grid item xs={12} md={5}>
                <Reveal>
                  <div className="label" style={{ color: '#ffd400', marginBottom: 12 }}>Contact</div>
                  <Typography variant="h2" sx={{ color: '#fff' }}>Let's talk.</Typography>
                  <Typography sx={{ mt: 2.5, color: 'rgba(255,255,255,.65)', lineHeight: 1.8 }}>Internship, freelance database work, or a hackathon team. My inbox is open.</Typography>
                  <Stack sx={{ mt: 4 }} spacing={0}>
                    {[[PROFILE.email, `mailto:${PROFILE.email}`], [PROFILE.phone, `tel:${PROFILE.phone.replace(/-/g, '')}`], ['ryanchen.xyz', PROFILE.site], ['linkedin.com/in/ryanchen07', PROFILE.linkedin], ['github.com/ryan-c07', PROFILE.github]].map(([t, h]) => (
                      <motion.a key={t} href={h} target={h.startsWith('http') ? '_blank' : undefined} rel="noopener" whileHover={{ x: 4 }}
                        style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 0', borderBottom: '1px solid rgba(255,255,255,.12)', color: '#fff', textDecoration: 'none', fontWeight: 600 }}>
                        <span>{t}</span><span style={{ color: '#ffd400' }}>{I.out}</span>
                      </motion.a>
                    ))}
                  </Stack>
                </Reveal>
              </Grid>
              <Grid item xs={12} md={7}>
                <Reveal delay={.1}>
                  <Card component="form" noValidate onSubmit={submit} sx={{ p: { xs: 3, md: 4 }, bgcolor: '#fff' }}>
                    <Grid container spacing={2}>
                      <Grid item xs={12} sm={6}>{f('name', 'Name')}</Grid>
                      <Grid item xs={12} sm={6}>{f('email', 'Email', { type: 'email' })}</Grid>
                      <Grid item xs={12}>{f('subject', 'Subject')}</Grid>
                      <Grid item xs={12}>{f('message', 'Message', { multiline: true, minRows: 4 })}</Grid>
                    </Grid>
                    <Button type="submit" variant="contained" size="large" fullWidth disabled={busy} sx={{ mt: 1 }}>{busy ? 'Sending…' : 'Send message'}</Button>
                    <Typography variant="caption" color="text.secondary" sx={{ display: 'block', textAlign: 'center', mt: 1.5 }}>Opens your mail client with the message pre-filled.</Typography>
                  </Card>
                </Reveal>
              </Grid>
            </Grid>
          </Container>
        </Box>
      );
    }

    /* ================= APP ================= */
    function App() {
      const [proj, setProj] = useState(null);
      const [snack, setSnack] = useState(null);
      const notify = (msg, type = 'success') => setSnack({ msg, type });
      const toContact = () => document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <FloatingNav onContact={toContact} />
          <Hero onContact={toContact} />
          <About />
          <Now />
          <Projects onOpen={setProj} />
          <StackSection />
          <Resume />
          <Contact notify={notify} />
          <Box component="footer" sx={{ bgcolor: '#0a0a0a', color: 'rgba(255,255,255,.5)', py: 3, borderTop: '1px solid rgba(255,255,255,.1)', textAlign: 'center', fontSize: 13 }}>
            © {new Date().getFullYear()} {PROFILE.name} · Made with <span style={{ color: '#ffd400' }}>♥</span> using React &amp; Material UI
          </Box>
          <ProjectDialog p={proj} onClose={() => setProj(null)} onContact={toContact} />
          <Snackbar open={!!snack} autoHideDuration={4500} onClose={() => setSnack(null)} anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}>
            {snack && <Alert onClose={() => setSnack(null)} severity={snack.type} variant="filled" sx={{ borderRadius: 3, bgcolor: snack.type === 'success' ? '#ffd400' : undefined, color: snack.type === 'success' ? '#000' : undefined, fontWeight: 600 }}>{snack.msg}</Alert>}
          </Snackbar>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
